# ${LIQUIDITY_DB_BUCKET} is set on the Cloud Run service by scripts/deploy.ps1.
dbs:
  - path: /home/gerb/chat.db
    replicas:
      - url: gcs://${LIQUIDITY_DB_BUCKET}/litestream/chat.db
        sync-interval: 1s
  - path: /home/gerb/gpt.db
    replicas:
      - url: gcs://${LIQUIDITY_DB_BUCKET}/litestream/gpt.db
        sync-interval: 1s
